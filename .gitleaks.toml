title = "mtb-aggregator gitleaks"

[extend]
useDefault = true

# Scraper vitest fixtures are captured retailer HTML/JSON. Sanitize live widget keys
# before commit (see docs/SCRAPING.md#test-fixtures-and-ci-gitleaks); this allowlist
# avoids false positives on placeholder values and multi-commit PR fixups.
[[allowlists]]
description = "Scraper parser test fixtures"
paths = [
  '''(?:^|/)apps/scraper/src/parsers/__fixtures__/''',
]
