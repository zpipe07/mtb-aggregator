name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; keep every push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# gitleaks lists PR commits via the GitHub API; the default GITHUB_TOKEN often lacks
# pull-requests:read unless declared (otherwise 403 Resource not accessible by integration).
# dorny/paths-filter uses the same permission to list the PR file set.
permissions:
  contents: read
  pull-requests: read

# Jobs that cannot be affected by the diff are skipped (ZAC-293). GitHub bills each
# job, so ZAC-249's parallel split (~9 runners) multiplied minutes vs the old sequential
# job. Path filters + gating docker/Lighthouse/audit keep wall-clock parallelism on the
# jobs that matter without paying for docs-only / single-app PRs.
# A `test` aggregator keeps the historical required-check name green when skipped jobs
# are path-filtered. Require only `test` on the branch — skipped required jobs block merge.

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      scraper: ${{ steps.filter.outputs.scraper }}
      docker: ${{ steps.filter.outputs.docker }}
      node: ${{ steps.filter.outputs.node }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/logging/**'
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            scraper:
              - 'apps/scraper/**'
              - 'packages/logging/**'
            docker:
              - 'apps/api/Dockerfile'
              - 'apps/scraper/Dockerfile'
              - 'docker-compose.yml'
              - '**/.dockerignore'
              - '**/*.dockerignore'
            node:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '**/package.json'
            ci:
              - '.github/**'
              - 'scripts/check-build-version-sync.sh'
              - 'scripts/ci-aggregate-results.py'

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Docker and CI tool versions
        run: bash scripts/check-build-version-sync.sh

      - name: CI aggregator self-test
        run: python3 scripts/ci-aggregate-results.py --self-test

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-check:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      # Lint (eslint-plugin-security) and tsc are independent; overlap them.
      - name: Lint and typecheck web app
        run: |
          set +e
          pnpm --filter @mtb-aggregator/web run lint &
          lint_pid=$!
          pnpm --filter @mtb-aggregator/web exec tsc --noEmit &
          tsc_pid=$!
          wait "$lint_pid"
          lint_status=$?
          wait "$tsc_pid"
          tsc_status=$?
          if [ "$lint_status" -ne 0 ] || [ "$tsc_status" -ne 0 ]; then
            echo "lint exit=${lint_status} tsc exit=${tsc_status}"
            exit 1
          fi

      - name: SEO smoke (JSON-LD builders)
        run: pnpm --filter @mtb-aggregator/web run seo:smoke

      - name: Web tests
        run: pnpm --filter @mtb-aggregator/web run test

  web:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      # Restore/install LHCI before the Next.js build so a cache miss overlaps compile time.
      # Lighthouse is main-only (ZAC-293): PRs already run seo:smoke; billed minutes add up
      # when every cloud-agent push starts a local Next server.
      - name: Cache Lighthouse CI CLI
        if: ${{ github.event_name == 'push' && vars.API_URL != '' }}
        id: lhci-cache
        uses: actions/cache@v4
        with:
          path: /tmp/lhci
          key: lhci-cli-0.14.0-${{ runner.os }}-node20

      - name: Start Lighthouse CI CLI install
        if: ${{ github.event_name == 'push' && vars.API_URL != '' && steps.lhci-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /tmp/lhci
          (
            npm install --prefix /tmp/lhci @lhci/cli@0.14.0
            echo $? > /tmp/lhci-install.exit
          ) > /tmp/lhci-install.log 2>&1 &
          echo $! > /tmp/lhci-install.pid

      # API_URL must be set so Next.js can fetch data during static generation.
      # Add API_URL in repo Settings → Secrets and variables → Actions (Secrets).
      - name: Web build
        run: pnpm --filter @mtb-aggregator/web run build

      - name: Wait for Lighthouse CI CLI
        if: ${{ github.event_name == 'push' && vars.API_URL != '' && steps.lhci-cache.outputs.cache-hit != 'true' }}
        run: |
          pid=$(cat /tmp/lhci-install.pid)
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat /tmp/lhci-install.log
          if [ ! -f /tmp/lhci-install.exit ]; then
            echo "lhci install did not write an exit code"
            exit 1
          fi
          exit "$(cat /tmp/lhci-install.exit)"

      # Lighthouse SEO assertions (requires a running Next server + live API). Enable by setting
      # API_URL in repository Variables (same value as for the web build). Main / push only.
      - name: Lighthouse CI (SEO category)
        if: ${{ github.event_name == 'push' && vars.API_URL != '' }}
        timeout-minutes: 6
        working-directory: apps/web
        env:
          API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: /tmp/lhci/node_modules/.bin/lhci autorun

  api:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum

      - name: Add cached Go tools to PATH
        run: echo "${{ github.workspace }}/.gopath/bin" >> "$GITHUB_PATH"

      - name: Cache Go analysis tools
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gopath/bin
          key: go-tools-staticcheck-v0.7.0-govulncheck-v1.2.0-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}

      - name: Install Go analysis tools
        env:
          GOBIN: ${{ github.workspace }}/.gopath/bin
        run: |
          mkdir -p "$GOBIN"
          if [ ! -x "$GOBIN/staticcheck" ]; then
            go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          fi
          if [ ! -x "$GOBIN/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          fi

      - name: Go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Staticcheck
        working-directory: apps/api
        run: staticcheck ./...

      - name: Go vulnerability check
        working-directory: apps/api
        run: govulncheck ./...

      - name: API tests
        working-directory: apps/api
        run: go test ./...

      - name: API build
        run: cd apps/api && go build -o /dev/null .

  scraper:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.scraper == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Build logging package
        run: pnpm --filter @mtb-aggregator/logging run build

      - name: Logging package tests
        run: pnpm --filter @mtb-aggregator/logging run test

      - name: Build scraper
        run: pnpm --filter @mtb-aggregator/scraper run build

      - name: Scraper tests
        run: pnpm --filter @mtb-aggregator/scraper run test

  docker:
    needs: changes
    # Images are a compile-adjacent check (api/scraper jobs already compile). Skip on PRs
    # unless a Dockerfile / compose file changed; still build on every push to main so a
    # merge that breaks alpine/pnpm in the image is caught before Render.
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image: mtb-api-ci
          - name: scraper
            dockerfile: apps/scraper/Dockerfile
            image: mtb-scraper-ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-docker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-docker-${{ matrix.name }}
          # Attestations require pushing the image.
          provenance: false
          sbom: false

  audit:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Node dependency audit
        env:
          # The npm security-audits endpoint is flaky (ERR_SOCKET_TIMEOUT).
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_maxtimeout: "120000"
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level=high; then
              exit 0
            fi
            echo "pnpm audit failed (attempt ${attempt}/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

  # Historical required-check name. Fails on failure/cancelled; path-filtered skips are OK.
  test:
    needs: [changes, secrets, web, web-check, api, scraper, docker, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-aggregate-results.py
