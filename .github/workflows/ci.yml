name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# gitleaks lists PR commits via the GitHub API; the default GITHUB_TOKEN often lacks
# pull-requests:read unless declared (otherwise 403 Resource not accessible by integration).
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Docker and CI tool versions
        run: pnpm run check:build-versions

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint web app
        run: pnpm --filter @mtb-aggregator/web run lint

      - name: Type check web app
        run: pnpm --filter @mtb-aggregator/web exec tsc --noEmit

      - name: SEO smoke (JSON-LD builders)
        run: pnpm --filter @mtb-aggregator/web run seo:smoke

      - name: Web tests
        run: pnpm --filter @mtb-aggregator/web run test

      - name: Node dependency audit
        run: pnpm audit --audit-level=high

      - name: Go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Staticcheck
        working-directory: apps/api
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Go vulnerability check
        working-directory: apps/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          govulncheck ./...

      - name: API tests
        working-directory: apps/api
        run: go test ./...

      - name: Build logging package
        run: pnpm --filter @mtb-aggregator/logging run build

      - name: Logging package tests
        run: pnpm --filter @mtb-aggregator/logging run test

      - name: Build scraper
        run: pnpm --filter @mtb-aggregator/scraper run build

      - name: Scraper tests
        run: pnpm --filter @mtb-aggregator/scraper run test

      - name: Build API Docker image
        run: docker build -t mtb-api-ci -f apps/api/Dockerfile .

      - name: Build scraper Docker image
        run: docker build -t mtb-scraper-ci -f apps/scraper/Dockerfile .

      - name: API build
        run: cd apps/api && go build -o /dev/null .

      # API_URL must be set so Next.js can fetch data during static generation.
      # Add API_URL in repo Settings → Secrets and variables → Actions (Secrets).
      - name: Web build
        run: pnpm --filter @mtb-aggregator/web run build

      # Lighthouse SEO assertions (requires a running Next server + live API). Enable by setting
      # API_URL in repository Variables (same value as for the web build).
      - name: Lighthouse CI (SEO category)
        if: ${{ vars.API_URL != '' }}
        working-directory: apps/web
        env:
          API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npx --yes @lhci/cli@0.14.0 autorun
